name: Java Tests

on:
  push:
    branches: ["master", "dev", "main", "feature/**"]
  pull_request:
    branches: ["master", "dev", "main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test
