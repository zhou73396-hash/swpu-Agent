spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.swpuagent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret-key: ${JWT_SECRET_KEY:swpu-agent-default-jwt-key-min-32-chars}
  access-token-expire-minutes: 30
  refresh-token-expire-days: 7

db:
  encryption-key: ${DB_ENCRYPTION_KEY:swpu-agent-2026!!}

server:
  port: ${SERVER_PORT:8080}

# Python Agent service (LangChain real AI agents)
agent:
  python:
    base-url: ${AGENT_PYTHON_URL:http://localhost:8000}

logging:
  level:
    com.swpuagent: DEBUG
    root: WARN
